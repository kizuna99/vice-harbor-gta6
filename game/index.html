<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Vice Harbor — Port Serena</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; padding: 0; background: #0b1020; height: 100%; overflow: hidden; }
  #game { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #touch { position: fixed; inset: 0; pointer-events: none; display: none; }
  #touch.on { display: block; }
  .tbtn {
    pointer-events: auto; position: absolute; width: 58px; height: 58px;
    border-radius: 50%; border: 2px solid rgba(255,255,255,.55);
    background: rgba(10,14,28,.45); color: #fff; font: 700 15px system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; user-select: none;
    -webkit-user-select: none; touch-action: none;
  }
  .tbtn:active { background: rgba(255,210,63,.5); }
  #btn-up    { left: 76px;  bottom: 96px; }
  #btn-down  { left: 76px;  bottom: 24px; }
  #btn-left  { left: 8px;   bottom: 60px; }
  #btn-right { left: 144px; bottom: 60px; }
  #btn-act   { right: 16px; bottom: 96px; }
  #btn-brake { right: 16px; bottom: 24px; }
</style>
</head>
<body>
<canvas id="game" width="960" height="600"></canvas>
<div id="touch">
  <div class="tbtn" id="btn-up" data-vmove="up">▲</div>
  <div class="tbtn" id="btn-down" data-vmove="down">▼</div>
  <div class="tbtn" id="btn-left" data-vmove="left">◀</div>
  <div class="tbtn" id="btn-right" data-vmove="right">▶</div>
  <div class="tbtn" id="btn-act" data-vkey="KeyE">E</div>
  <div class="tbtn" id="btn-brake" data-vkey="Space">BRK</div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
