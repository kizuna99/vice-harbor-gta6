<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230d1520'/%3E%3Ctext x='8' y='12' font-size='10' text-anchor='middle' fill='%23ffd23e'%3EV%3C/text%3E%3C/svg%3E">
<title>Vice Harbor — Port Serena</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1520; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #pad { position: fixed; right: 10px; bottom: 76px; display: none; gap: 8px; z-index: 5; }
  #pad button {
    width: 52px; height: 52px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.4);
    background: rgba(10,14,22,0.55); color: #e8ecf2; font: bold 15px system-ui, sans-serif;
  }
  @media (pointer: coarse) { #pad { display: flex; } }
</style>
</head>
<body>
<canvas id="game" aria-label="Vice Harbor: a top-down open-world driving and action game set in Port Serena"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="pad" aria-hidden="true">
  <button data-key="KeyW">▲</button>
  <button data-key="KeyA">◀</button>
  <button data-key="KeyS">▼</button>
  <button data-key="KeyD">▶</button>
  <button data-key="KeyE">E</button>
  <button data-key="KeyJ">J</button>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
